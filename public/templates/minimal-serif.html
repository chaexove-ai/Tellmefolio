    <style>
        @view-transition { navigation: auto; }
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation-duration: 0.4s;
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #ffffff;
            scroll-behavior: smooth;
        }
        .font-display {
            font-family: 'Playfair Display', serif;
        }
        .subtle-glow {
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.05) 0%, transparent 60%);
        }
        .hover-lift {
            transition: transform 0.5s cubic-bezier(0.2, 0, 0, 1);
        }
        .hover-lift:hover {
            transform: translateY(-4px);
        }
        .project-card {
            transition: opacity 0.4s ease;
        }
        .project-card:hover img {
            filter: grayscale(0%);
        }
    </style>

    <div class="min-h-screen relative overflow-x-hidden">
        <!-- Navigation -->
        <nav class="fixed top-0 w-full z-50 py-10 px-8 md:px-20">
            <div class="max-w-7xl mx-auto flex justify-between items-end">
                <a href="#" id="nav-logo" data-tf="title" class="text-2xl font-display italic tracking-tighter">포트폴리오</a>
                <div class="hidden md:flex items-center gap-16 text-[10px] font-semibold uppercase tracking-[0.3em] text-white/40">
                    <a href="#work" id="nav-work-link" class="hover:text-white transition-colors">프로젝트</a>
                    <a href="#about" id="nav-about-link" class="hover:text-white transition-colors">소개</a>
                    <a href="#contact" id="nav-contact-link" class="hover:text-white transition-colors">연락처</a>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="relative min-h-screen flex items-center justify-center pt-20">
            <div class="absolute inset-0 subtle-glow -z-10"></div>
            <div class="max-w-5xl mx-auto px-8 text-center">
                <h1 class="text-6xl md:text-8xl font-display font-medium tracking-tight mb-12 leading-tight">
                    <span data-tf="title">포트폴리오</span>
                </h1>
                <p class="max-w-xl mx-auto text-lg text-white/40 mb-16 font-light leading-relaxed">
                    <span data-tf="summary"></span>
                </p>
                <div class="flex flex-col items-center gap-8">
                    <a href="#work" id="hero-view-work" class="text-[10px] font-bold uppercase tracking-[0.4em] text-[#00FFFF] hover:opacity-70 transition-opacity flex items-center gap-4 group" data-tf-if="job">
                        <span data-tf="job"></span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m7-7l-7 7l-7-7"></path></svg>
                    </a>
                </div>
            </div>
        </section>

        <!-- Work Section -->
        <section id="work" class="py-48 px-8 md:px-20">
            <div class="max-w-7xl mx-auto">
                <div class="mb-32">
                    <span class="text-[10px] font-bold uppercase tracking-[0.4em] text-white/30 block mb-6">Portfolio Selection</span>
                    <h2 class="text-4xl md:text-5xl font-display font-medium">Selected Works</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-20 gap-y-40">
                    <!-- 프로젝트 한 건. 이 덩어리가 프로젝트 수만큼 복제됩니다. -->
                    <div data-tf-repeat="projects" class="group project-card">
                        <div data-tf-if="image" class="block overflow-hidden bg-[#0d0d0d] mb-8">
                            <img data-tf="image" src="" alt="" class="w-full aspect-[4/5] object-cover grayscale opacity-60 transition-all duration-700 group-hover:opacity-100 group-hover:scale-105">
                        </div>
                        <div>
                            <h3 data-tf="name" class="text-2xl font-display mb-2"></h3>
                            <p data-tf-if="lead" data-tf="lead" class="text-xs text-white/30 font-semibold uppercase tracking-widest"></p>
                        </div>

                        <div data-tf-if="stack" class="flex flex-wrap gap-2 mt-5">
                            <span data-tf-repeat="stack" data-tf="." class="text-[10px] uppercase tracking-widest text-white/40 border border-white/10 px-3 py-1"></span>
                        </div>

                        <!-- 케이스 스터디로 쓴 프로젝트에만 나옵니다. -->
                        <div data-tf-if="fields" class="mt-10 space-y-7 border-t border-white/5 pt-8">
                            <div data-tf-repeat="fields">
                                <p data-tf="label" class="text-[10px] font-bold uppercase tracking-[0.4em] text-[#00FFFF] mb-3"></p>
                                <p data-tf="value" class="text-white/50 font-light leading-relaxed whitespace-pre-wrap"></p>
                            </div>
                        </div>

                        <!-- 직접 추가한 블록 -->
                        <div data-tf-if="blocks" class="mt-8 space-y-6">
                            <div data-tf-repeat="blocks">
                                <p data-tf-if="label" data-tf="label" class="text-[10px] font-bold uppercase tracking-[0.4em] text-white/25 mb-3"></p>
                                <p data-tf-if="text" data-tf="text" class="text-white/50 font-light leading-relaxed whitespace-pre-wrap"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- About Section -->
        <section id="about" class="py-40 px-8 md:px-20 bg-[#050505]">
            <div class="max-w-7xl mx-auto">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-20">
                    <!-- 표지가 없으면 이 칸이 통째로 사라지고 글이 전체폭을 씁니다. -->
                    <div data-tf-if="cover" class="lg:col-span-5">
                        <div class="aspect-[3/4] overflow-hidden bg-[#0d0d0d]">
                            <img data-tf="cover" src="" alt="" class="w-full h-full object-cover grayscale">
                        </div>
                    </div>
                    <div class="lg:col-span-7 flex flex-col justify-center">
                        <span class="text-[10px] font-bold uppercase tracking-[0.4em] text-[#00FFFF] mb-10 block">Background</span>
                        <h2 data-tf="title" class="text-4xl md:text-5xl font-display font-medium mb-10 leading-tight"></h2>
                        <p data-tf="summary" class="text-white/40 text-xl font-light leading-relaxed max-w-2xl"></p>

                        <!-- 원본에는 Expertise 와 Select Clients 가 글자로 박혀
                             있었습니다. 고객사(Monzo·Airbnb·Headspace)는 지어낸
                             것이었고, 전문 분야는 누가 쓰든 같은 항목이 나왔습니다.
                             프로젝트에 적은 스택에서 모아 씁니다. -->
                        <div data-tf-if="stack" class="mt-16 pt-10 border-t border-white/5">
                            <h5 class="text-[10px] font-bold uppercase tracking-[0.4em] text-white/20 mb-5">사용한 도구 · 기술</h5>
                            <ul class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-white/60">
                                <li data-tf-repeat="stack" data-tf="."></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="contact" class="py-40 px-8 md:px-20 border-t border-white/5">
            <div class="max-w-7xl mx-auto text-center">
                <h2 class="text-5xl md:text-8xl font-display font-medium tracking-tight mb-16">
                    함께 <span class="text-[#FF006E]">일해요.</span>
                </h2>
                <div class="flex flex-col items-center gap-10">
                    <a data-tf-if="email" data-tf="emailHref" href="#" class="text-2xl md:text-4xl font-display italic hover:text-[#00FFFF] transition-colors pb-4 border-b border-white/10">

                    </a>

                    <div class="flex gap-12 text-[10px] font-bold uppercase tracking-[0.4em] text-white/30">
                        <a data-tf-if="github" data-tf="github" href="#" target="_blank" rel="noreferrer" class="hover:text-white transition-colors">GitHub</a>
                        <a data-tf-if="site" data-tf="site" href="#" target="_blank" rel="noreferrer" class="hover:text-white transition-colors">웹사이트</a>
                    </div>
                </div>
            </div>
        </section>

        <footer class="py-12 px-8 md:px-20 border-t border-white/5">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3 text-[10px] font-bold uppercase tracking-[0.3em] text-white/20">
                <p data-tf="title"></p>
                <p>Tellmefolio</p>
            </div>
        </footer>
    </div>
