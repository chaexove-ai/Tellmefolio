    <style>
        @view-transition { navigation: auto; }
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation-duration: 0.4s;
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #ffffff;
            scroll-behavior: smooth;
        }
        .font-display {
            font-family: 'Playfair Display', serif;
        }
        .subtle-glow {
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.05) 0%, transparent 60%);
        }
        .hover-lift {
            transition: transform 0.5s cubic-bezier(0.2, 0, 0, 1);
        }
        .hover-lift:hover {
            transform: translateY(-4px);
        }
        .project-card {
            transition: opacity 0.4s ease;
        }
        .project-card:hover img {
            filter: grayscale(0%);
        }
    </style>

.mb-10{margin-bottom:2.5rem}.mb-5{margin-bottom:1.25rem}.mt-16{margin-top:4rem}.pt-10{padding-top:2.5rem}
.py-40{padding-top:10rem;padding-bottom:10rem}
@media (min-width:768px){.md\:text-4xl{font-size:2.25rem;line-height:2.5rem}}

/* 인쇄(PDF)는 흰 종이입니다 — 어두운 화면용 색을 그대로 쓰면 글자가 안 보입니다. */
@media print {
  :root {
    --tfw-ink: #111; --tfw-body: #333; --tfw-soft: #444; --tfw-muted: #666;
    --tfw-accent: #555; --tfw-line: #e2e2e2; --tfw-line-strong: #ccc; --tfw-frame: #f4f4f4;
  }
  .tfw dd, .tfw dt, .tfw figcaption, .tfw-card-lead, .tfw-role { color: var(--tfw-body) !important; }
  .tfw-row dt, .tfw-no { color: var(--tfw-accent) !important; }
}
</style>
</head>
<body class="sd-ready">
    <div class="min-h-screen relative overflow-x-hidden">
        <!-- Navigation -->
        <nav class="fixed top-0 w-full z-50 py-10 px-8 md:px-20">
            <div class="max-w-7xl mx-auto flex justify-between items-end">
                <a href="#" id="nav-logo" class="text-2xl font-display italic tracking-tighter"><span data-tf="title">포트폴리오</span></a>
                <div class="hidden md:flex items-center gap-16 text-[10px] font-semibold uppercase tracking-[0.3em] text-white/40">
                    <a href="#work" id="nav-work-link" class="hover:text-white transition-colors" data-tf-en="Work">프로젝트</a>
                    <a href="#about" id="nav-about-link" class="hover:text-white transition-colors" data-tf-en="About">소개</a>
                    <a href="#contact" id="nav-contact-link" class="hover:text-white transition-colors" data-tf-en="Contact">연락처</a>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="relative min-h-screen flex items-center justify-center pt-20">
            <div class="absolute inset-0 subtle-glow -z-10"></div>
            <div class="max-w-5xl mx-auto px-8 text-center">
                <h1 class="text-6xl md:text-8xl font-display font-medium tracking-tight mb-12 leading-tight">
                    <span data-tf="title">포트폴리오</span>
                </h1>
                <p class="max-w-xl mx-auto text-lg text-white/40 mb-16 font-light leading-relaxed">
                    <span data-tf="summary"></span>
                </p>
                <div class="flex flex-col items-center gap-8">
                    <a href="#work" id="hero-view-work" class="text-[10px] font-bold uppercase tracking-[0.4em] text-[#00FFFF] hover:opacity-70 transition-opacity flex items-center gap-4 group" data-tf-if="job">
                        <span data-tf="job"></span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m7-7l-7 7l-7-7"></path></svg>
                    </a>
                </div>
            </div>
        </section>

        <!-- [2026-09-28] 프로젝트 영역 — 어떤 프로젝트가 와도 정리되게.
             · 케이스 스터디(칸을 채운 것): 한 건씩 전체 폭. 번호·제목·역할·태그 →
               대표 이미지(원래 비율 그대로) → 칸별 글(왼쪽 제목 / 오른쪽 본문) → 갤러리
             · 짧은 작업(한 줄 설명): 아래 작은 카드 격자
             두 종류를 한 격자에 섞으면 긴 글 옆에 한 줄 카드가 서서 큰 빈칸이 생깁니다.
             이미지는 자르지 않습니다(세로 스크린숏·가로 파노라마 모두 전체가 보이게). -->
        <section id="work" class="tfw" data-tf-if="projects">
          <div class="tfw-wrap">
            <header class="tfw-head">
              <span class="tfw-eyebrow" data-tf-en="Portfolio Selection">Portfolio Selection</span>
              <h2 class="tfw-h2" data-tf-en="Selected Works">Selected Works</h2>
            </header>

            <div data-tf-if="caseStudies" class="tfw-cases">
              <article data-tf-repeat="caseStudies" class="tfw-case">
                <div class="tfw-case-head">
                  <span data-tf="no" class="tfw-no">01</span>
                  <div class="tfw-case-titles">
                    <h3 data-tf="title" class="tfw-title">프로젝트 이름</h3>
                    <p data-tf-if="role" data-tf="role" class="tfw-role">역할</p>
                  </div>
                  <ul data-tf-if="stack" class="tfw-tags"><li data-tf-repeat="stack" data-tf=".">Figma</li></ul>
                </div>

                <figure data-tf-if="hero" class="tfw-hero">
                  <div class="tfw-frame"><img data-tf="hero" src="" alt=""></div>
                  <figcaption data-tf-if="heroCaption" data-tf="heroCaption"></figcaption>
                </figure>

                <dl class="tfw-fields">
                  <div data-tf-repeat="fields" class="tfw-row">
                    <dt data-tf="label">맥락 및 배경</dt>
                    <dd data-tf="value">본문</dd>
                  </div>
                  <div data-tf-repeat="blocks" class="tfw-row">
                    <dt data-tf="label"></dt>
                    <dd data-tf-if="text" data-tf="text"></dd>
                  </div>
                </dl>

                <div data-tf-if="gallery" class="tfw-gallery">
                  <figure data-tf-repeat="gallery">
                    <div class="tfw-frame"><img data-tf="url" src="" alt=""></div>
                    <figcaption data-tf-if="caption" data-tf="caption"></figcaption>
                  </figure>
                </div>
              </article>
            </div>

            <div data-tf-if="otherWorks" class="tfw-others">
              <h3 data-tf-if="caseStudies" class="tfw-subhead" data-tf-en="Other work">그 밖의 작업</h3>
              <div class="tfw-grid">
                <article data-tf-repeat="otherWorks" class="tfw-card">
                  <div data-tf-if="hero" class="tfw-frame tfw-thumb"><img data-tf="hero" src="" alt=""></div>
                  <!-- 이미지가 없으면 첫 글자 자리표시 — 이미지 있는 카드 옆에서 줄이 어긋나지 않게 -->
                  <div data-tf-if="!hero" class="tfw-frame tfw-thumb tfw-thumb-empty" aria-hidden="true"><span data-tf="initial"></span></div>
                  <h4 data-tf="title" class="tfw-card-title">작업 이름</h4>
                  <p data-tf-if="lead" data-tf="lead" class="tfw-card-lead">한 줄 설명</p>
                  <ul data-tf-if="stack" class="tfw-tags"><li data-tf-repeat="stack" data-tf=".">Figma</li></ul>
                </article>
              </div>
            </div>
          </div>
        </section>

        <!-- About Section -->
        <section id="about" class="py-40 px-8 md:px-20 bg-[#050505]">
            <div class="max-w-7xl mx-auto">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-20">
                    <!-- 표지가 없으면 이 칸이 통째로 사라지고 글이 전체폭을 씁니다. -->
                    <div data-tf-if="cover" class="lg:col-span-5">
                        <div class="aspect-[3/4] overflow-hidden bg-[#0d0d0d]">
                            <img data-tf="cover" src="" alt="" class="w-full h-full object-cover grayscale">
                        </div>
                    </div>
                    <div class="lg:col-span-7 flex flex-col justify-center">
                        <span class="text-[10px] font-bold uppercase tracking-[0.4em] text-[#00FFFF] mb-10 block">Background</span>
                        <h2 data-tf="title" class="text-4xl md:text-5xl font-display font-medium mb-10 leading-tight"></h2>
                        <p data-tf="summary" class="text-white/40 text-xl font-light leading-relaxed max-w-2xl"></p>

                        <!-- 원본에는 Expertise 와 Select Clients 가 글자로 박혀
                             있었습니다. 고객사(Monzo·Airbnb·Headspace)는 지어낸
                             것이었고, 전문 분야는 누가 쓰든 같은 항목이 나왔습니다.
                             프로젝트에 적은 스택에서 모아 씁니다. -->
                        <div data-tf-if="stack" class="mt-16 pt-10 border-t border-white/5">
                            <h5 class="text-[10px] font-bold uppercase tracking-[0.4em] text-white/20 mb-5" data-tf-en="Tools &amp; Technologies">사용한 도구 · 기술</h5>
                            <ul class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-white/60">
                                <li data-tf-repeat="stack" data-tf="."></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="contact" class="py-40 px-8 md:px-20 border-t border-white/5">
            <div class="max-w-7xl mx-auto text-center">
                <h2 class="text-5xl md:text-8xl font-display font-medium tracking-tight mb-16">
                    <span data-tf-en="Let's work">함께</span> <span class="text-[#FF006E]" data-tf-en="together.">일해요.</span>
                </h2>
                <div class="flex flex-col items-center gap-10">
                    <a data-tf-if="email" data-tf="emailHref" href="#" class="text-2xl md:text-4xl font-display italic hover:text-[#00FFFF] transition-colors pb-4 border-b border-white/10">
                        <span data-tf="email"></span>
                    </a>
                    <!-- 원본에는 Dribbble·LinkedIn·Instagram 이 빈 링크(#)로
                         박혀 있었습니다. 누르면 아무 데도 안 가는 링크는
                         없는 것만 못합니다. -->
                    <div class="flex gap-12 text-[10px] font-bold uppercase tracking-[0.4em] text-white/30">
                        <a data-tf-if="github" data-tf="github" href="#" target="_blank" rel="noreferrer" class="hover:text-white transition-colors">GitHub</a>
                        <a data-tf-if="site" data-tf="site" href="#" target="_blank" rel="noreferrer" class="hover:text-white transition-colors" data-tf-en="Website">웹사이트</a>
                    </div>
                </div>
            </div>
        </section>

        <footer class="py-12 px-8 md:px-20 border-t border-white/5">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3 text-[10px] font-bold uppercase tracking-[0.3em] text-white/20">
                <p data-tf="title"></p>
                <p>Tellmefolio</p>
            </div>
        </footer>
    </div>
</body></html>
