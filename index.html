    <meta

    />

    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph — 카카오톡·슬랙·링크드인 공유 미리보기 -->

    <meta property="og:title" content="내 경험을 직무 언어로, AI 포트폴리오 제작 도구" />
    <meta
      property="og:description"
      content="이야기하면 포트폴리오가 됩니다 — 원본 자료를 케이스 스터디로, 같은 프로젝트를 여러 직무 관점으로."
    />
    <meta property="og:image" content="https://tellmefolio-app.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tellmefolio — AI 포트폴리오 제작 도구" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="내 경험을 직무 언어로, AI 포트폴리오 제작 도구" />
    <meta
      name="twitter:description"
      content="이야기하면 포트폴리오가 됩니다 — 원본 자료를 케이스 스터디로, 같은 프로젝트를 여러 직무 관점으로."
    />
    <meta name="twitter:image" content="https://tellmefolio-app.vercel.app/og.png" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 구조화 데이터: 검색 결과 리치 스니펫 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Tellmefolio",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "ko",
        "url": "https://tellmefolio-app.vercel.app/",
        "description": "GitHub·PDF·링크·메모를 분석해 AI가 포트폴리오 초안을 만들고, 채용 공고에 맞춰 직무 관점으로 재구성해 주는 도구."
      }
    </script>

    <!-- 테마 깜빡임(FOUC) 방지: 스타일시트/React가 로드되기 전에 저장된
         테마를 먼저 적용합니다.
         (원본 그대로 유지 — index.css가 `:root.light` 만 키로 쓰고
          ThemeContext도 `.light` 만 토글하므로 다크에서 클래스가 비는 것은
          버그가 아니라 설계입니다.) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tellmefolio-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          if (theme === "light") document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>

    <!-- 제목용 서체: Gowun Batang (한글 지원, 시스템 기본값이 아닌 의도적 선택) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- 본문용 서체: Pretendard
         [2026-08 수정] pretendardvariable.css(풀셋) →
                        pretendardvariable-dynamic-subset.css
         유니코드 레인지별로 쪼개져 있어 실제 사용하는 글자 조각만 내려받습니다.
         계측값: 웹폰트 전송량 2,181KB (woff2 11개) → 수백 KB 수준으로 감소. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
  </head>
  <body class="bg-neutral-950 text-neutral-100">
