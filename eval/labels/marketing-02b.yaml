    trap: null
    note: 고객 후기 사진을 동의를 받아 재게시하는 코너를 운영했다.
  - id: r10
    text: 콘텐츠 캘린더 등으로 발행 일정을 관리해 본 경험
    label: 콘텐츠 캘린더
    kind: nice
