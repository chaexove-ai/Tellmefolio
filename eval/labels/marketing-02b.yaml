# trap: 일부러 넣은 함정. T1 수치 · T2 도구 · T3 도메인 · T4 유사어 · T5 역할 과장 · T6 이력서 요건
case: marketing-02b
portfolio: pf-marketing-02
job: jd-marketing-02b
