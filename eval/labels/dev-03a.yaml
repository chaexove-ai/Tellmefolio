# 정답 라벨 — 사람이 검수하는 원본입니다. 검수용 표는 npm run eval:review 로 만듭니다.
# level: full(직접 보여줌) / partial(관련 있지만 약함) / none(없음). profile 요건은 null.
# trap: 일부러 넣은 함정. T1 수치 · T2 도구 · T3 도메인 · T4 유사어 · T5 역할 과장 · T6 이력서 요건
case: dev-03a
portfolio: pf-dev-03
job: jd-dev-03a
target_job: 서비스 기획자 (PM)
family: dev
job_family: planning
difficulty: cross
reviewed: false
reviewer: null
lead: problem
vocabulary: [문제 정의, 가설, 기능 명세서, 우선순위, 사용자 행동 데이터, 출시, 지표, 정성 리서치, 스쿼드, 운영 정책]
must_not_appear: [Figma, 와이어프레임, 프로토타입, B2B, SaaS, 로드맵]
requirements:
  - id: r1
    text: 서비스 기획 또는 PM 경력 2년 이상
    label: 기획 경력 2년
    kind: must
    scope: profile
    keywords: [서비스 기획, PM 경력, 2년 이상]
    level: null
    evidence: []
    trap: T6
    note: 경력 연수는 이력서로 확인할 요건. PM 공백 6주 동안 명세를 정리한 경험을 기획 경력으로 환산하면 안 된다.
  - id: r2
    text: 사용자 문제를 정의하고 가설을 세워 본 경험
    label: 문제 정의·가설
    kind: must
    scope: project
    keywords: [문제 정의, 가설]
    level: partial
    evidence: [p0:problem:0, p0:execution:2, p0:execution:3]
    trap: null
    note: 데이터로 이탈 지점을 찾아 단계 이동을 제안한 것은 문제 정의에 해당하지만, 가설을 세웠다는 문장은 없고 결정은 PM 이 했다. full 주장도 가능해 검수 시 확인 필요.
  - id: r3
    text: 화면별 기능 명세서 작성 경험
    label: 기능 명세서
    kind: must
    scope: project
    keywords: [기능 명세서, 화면별]
    level: full
    evidence: [p2:role:0, p2:execution:0]
    trap: null
    note: 화면별 기능 명세를 노션 문서로 정리한 문장이 직접 근거. 다만 기존 논의를 모은 성격이고 반성에서 "왜"에 답하지 못했다고 밝히므로, 재작성에서 기획 의도까지 설계한 것처럼 쓰면 과장.
  - id: r4
    text: SQL·GA4 등으로 사용자 행동 데이터를 분석해 의사결정한 경험
    label: 데이터 분석
    kind: must
    scope: project
    keywords: [SQL, GA4, 사용자 행동 데이터]
    level: full
    evidence: [p0:execution:0, p0:execution:1, p0:execution:3]
    trap: null
    note: GA4 이벤트와 SQL 로 단계별 이탈을 뽑았고 그 결과로 온보딩 변경이 결정됐다. 최종 결정자는 PM 이지만 분석이 결정의 근거가 된 것은 직접 드러난다.
  - id: r5
    text: 제품 로드맵을 수립하고 우선순위 결정을 주도한 경험
    label: 로드맵·우선순위
    kind: must
    scope: project
    keywords: [로드맵, 우선순위, 주도]
    level: none
    evidence: []
    trap: T5
    note: 원문은 "대표와 디자이너가 정한 우선순위에 따라" 출시 범위를 개발 일정으로 나눴다고 명시한다. 우선순위를 실행 단위로 쪼갠 것을 결정 주도로 부풀리면 날조.
  - id: r6
    text: Figma로 와이어프레임이나 프로토타입을 직접 만들 수 있는 분
    label: 와이어프레임
    kind: must
    scope: project
    keywords: [Figma, 와이어프레임, 프로토타입]
    level: none
    evidence: []
    trap: T2
    note: 원문 도구는 노션·슬랙이고 화면 흐름은 디자이너 몫이었다. "화면 흐름"이라는 말이 있어도 직접 그린 문장이 없으며, Figma 가 나오면 날조.
  - id: r7
    text: 개발·디자인 직군과 협업해 기능을 출시해 본 경험
    label: 협업 출시
    kind: must
    scope: project
    keywords: [개발, 디자인, 협업, 출시]
    level: full
    evidence: [p0:role:0, p2:execution:2, p2:outcome:0]
    trap: null
    note: PM·디자이너와 온보딩 개선을 함께 했고, 코칭 기능 1차 출시 범위를 일정으로 나눠 2025년 3월에 출시했다(1주 지연도 사실 그대로 써야 함).
  - id: r8
    text: B2B SaaS 도메인 경험
    label: B2B SaaS
    kind: nice
    scope: project
    keywords: [B2B, SaaS]
    level: none
    evidence: []
    trap: T3
    note: 원문은 개인 사용자 대상 습관 기록 앱(B2C)이다. 운영자용 관리 화면은 사내 도구일 뿐 B2B 고객 경험이 아니다.
  - id: r9
    text: 사용자 인터뷰 등 정성 리서치를 직접 수행한 경험
    label: 사용자 인터뷰
    kind: nice
    scope: project
    keywords: [사용자 인터뷰, 정성 리서치, 직접 수행]
    level: partial
    evidence: [p2:execution:1]
    trap: null
    note: 디자이너가 진행한 인터뷰 3건에 참관해 메모를 정리했다. 관련은 있으나 직접 수행은 아니라 partial. 공고가 "직접"을 강조해 none 주장도 가능. 재작성에서 "인터뷰를 진행"으로 쓰면 역할 과장.
  - id: r10
    text: 출시 후 지표로 기능 성과를 측정한 경험
    label: 출시 후 지표
    kind: nice
    scope: project
    keywords: [출시 후 지표, 성과 측정]
    level: full
    evidence: [p0:outcome:0, p2:outcome:1]
    trap: null
    note: 온보딩 변경 후 첫 기록 비율 41% → 58%, 코칭 출시 첫 달 유료 전환 95명.
  - id: r11
    text: 이용 약관·환불 정책 등 서비스 운영 정책을 수립한 경험
    label: 운영 정책
    kind: nice
    scope: project
    keywords: [운영 정책, 이용 약관, 환불 정책]
    level: none
    evidence: []
    trap: null
    note: 원문에 정책을 다룬 문장이 없다. 의도한 함정은 아니고 직무 전환에서 자연스럽게 비는 요구사항. 유료 코칭이 있어 환불 정책을 지어낼 여지는 있다.
