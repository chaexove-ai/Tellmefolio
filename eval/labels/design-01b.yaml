# 정답 라벨 — 사람이 검수하는 원본입니다. 검수용 표는 npm run eval:review 로 만듭니다.
# level: full(직접 보여줌) / partial(관련 있지만 약함) / none(없음). profile 요건은 null.
# trap: 일부러 넣은 함정. T1 수치 · T2 도구 · T3 도메인 · T4 유사어 · T5 역할 과장 · T6 이력서 요건
case: design-01b
portfolio: pf-design-01
job: jd-design-01b
target_job: 시니어 프로덕트 디자이너
family: design
job_family: design
difficulty: partial_gap
reviewed: false
reviewer: null
lead: problem
vocabulary: [디자인 시스템, 디자인 토큰, 사용성 테스트, 과제 성공률, 멘토링, 디자인 리뷰, 접근성, 송금, 자산관리, 지표 검증]
must_not_appear: [과제 성공률, SUS, 멘토링, 리딩, 총괄, 송금, 자산관리, 대출, 금융, WCAG, 접근성]
requirements:
  - id: r1
    text: 모바일 서비스 UX/UI 디자인 실무 경험
    label: 모바일 UX/UI
    kind: must
    scope: project
    keywords: [모바일 서비스, UX/UI]
    level: full
    evidence: [p0:role:0, p0:execution:0]
    trap: null
    note: 앱 결제 흐름의 화면 설계·UI를 직접 맡았다.
  - id: r2
    text: 디자인 시스템을 구축하고 개발 조직과 함께 운영해 본 경험
    label: 디자인 시스템 구축
    kind: must
    scope: project
    keywords: [디자인 시스템, 구축, 개발 조직]
    level: full
    evidence: [p1:execution:0, p1:execution:1, p1:execution:2]
    trap: null
    note: 컴포넌트 통합·토큰 정의·Storybook 이름 맞추기까지 개발자와 함께 했다. 3명 중 한 명이었다는 점은 r3 에서 다룬다.
  - id: r3
    text: 디자인 시스템 또는 디자인 팀을 리드하며 다른 디자이너를 이끈 경험
    label: 디자인 리딩
    kind: must
    scope: project
    keywords: [리드, 이끈 경험, 디자인 팀]
    level: none
    evidence: []
    trap: T5
    note: 원문은 디자이너 3명 중 한 명이고 구조·우선순위는 디자인 팀장이 정했다고 명시한다. 신규 디자이너가 가이드로 적응한 것(p1:outcome:1)도 가이드 문서의 효과일 뿐 이끈 경험이 아니다.
  - id: r4
    text: 사용성 테스트를 직접 설계하고 과제 성공률·소요 시간 등 정량 결과를 분석해 본 경험
    label: 정량 사용성 테스트
    kind: must
    scope: project
    keywords: [사용성 테스트, 과제 성공률, 소요 시간, 정량 분석]
    level: partial
    evidence:
      - p0:execution:2
    trap: null
    note: 원문은 사내 동료 6명에게 시안을 써 보게 하고 의견을 받은 것뿐이고, 본인도 회고에서 검증이 부족했다고 쓴다. 비공식 시안 점검은 있으므로 "사용성 테스트 경험"만 묻는다면 partial 로 볼 여지가 있으나, 이 요건의 핵심은 설계와 정량 분석이라 none 으로 둔다.
    human:
      reviewer: 채환
      at: 2026-10-01
      decision: none→partial
      comment: ‘정성적인 사용자 테스트(UT, Usability Testing)를 직접 진행해본 경험’은 맞지만, ‘과제 성공률이나 소요 시간 등의 정량적 지표를 체계적으로 측정 및 분석한 경험’으로 보기에는 어렵습니다. 측정 지표(과제 성공률, 소요 시간 등)의 부재, 표본(Sample)과 환경의 한계
      was_trap: T4
  - id: r5
    text: 복잡한 절차를 사용자가 이해하기 쉬운 흐름으로 단순화해 본 경험
    label: 흐름 단순화
    kind: must
    scope: project
    keywords: [복잡한 절차, 단순화, 흐름]
    level: full
    evidence: [p0:problem:0, p0:execution:0, p0:execution:1]
    trap: null
    note: 5단계 결제 흐름을 3단계로 줄이고 배송 선택지를 카드로 비교하게 했다.
  - id: r6
    text: 데이터로 문제를 찾고 개선 결과를 지표로 검증한 경험
    label: 데이터 기반 검증
    kind: must
    scope: project
    keywords: [데이터, 지표, 검증]
    level: full
    evidence: [p0:problem:1, p0:outcome:0]
    trap: null
    note: GA4 퍼널로 이탈 구간을 찾고 이탈률 38%→24% 로 확인했다.
  - id: r7
    text: 송금·자산관리·대출 등 금융 서비스 도메인 경험
    label: 금융 도메인
    kind: nice
    scope: project
    keywords: [송금, 자산관리, 대출, 금융]
    level: none
    evidence: []
    trap: T3
    note: 원문의 "결제"는 중고 가구 거래 앱의 결제 단계 화면이지 금융 서비스가 아니다. 결제 화면 경험을 금융 도메인 경험으로 옮겨 쓰면 날조.
  - id: r8
    text: 접근성 가이드(WCAG)를 반영해 화면을 설계해 본 경험
    label: 접근성
    kind: nice
    scope: project
    keywords: [접근성, WCAG]
    level: none
    evidence: []
    trap: null
    note: 원문에 접근성 관련 내용이 전혀 없다. 의도한 함정은 아니고 진짜 빈 요구사항.
  - id: r9
    text: 개발자와 디자인 토큰 체계를 맞춰 본 경험
    label: 토큰 협업
    kind: nice
    scope: project
    keywords: [디자인 토큰, 개발자]
    level: full
    evidence: [p1:execution:1, p1:execution:2]
    trap: null
    note: 토큰을 정의하고 프론트엔드 개발자 2명과 이름을 맞췄다.
  - id: r10
    text: 실제 사용자 의견을 설계에 반영해 본 경험
    label: 사용자 의견 반영
    kind: nice
    scope: project
    keywords: [사용자 의견, 반영]
    level: partial
    evidence: [p0:execution:2, p0:problem:2]
    trap: null
    note: 의견을 받은 대상은 실제 사용자가 아닌 사내 동료이고(회고에서 본인도 인정), 사용자 판단의 어려움은 데이터·문의로 파악한 것이라 partial. none 과 고민했으나 사용자 문제를 근거로 설계를 바꾼 흐름은 있어 partial 로 둔다.
