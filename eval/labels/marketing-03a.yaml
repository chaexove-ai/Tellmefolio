# 정답 라벨 — 사람이 검수하는 원본입니다. 검수용 표는 npm run eval:review 로 만듭니다.
# level: full(직접 보여줌) / partial(관련 있지만 약함) / none(없음). profile 요건은 null.
# trap: 일부러 넣은 함정. T1 수치 · T2 도구 · T3 도메인 · T4 유사어 · T5 역할 과장 · T6 이력서 요건
case: marketing-03a
portfolio: pf-marketing-03
job: jd-marketing-03a
target_job: 그로스 PM
family: marketing
job_family: planning
difficulty: cross
reviewed: false
reviewer: null
lead: problem
vocabulary: [그로스, 퍼널, 전환율, 가설, VOC, 와이어프레임, 화면 기획서, 실험, 로드맵, 스프린트]
must_not_appear: [A/B 테스트, AB 테스트, Amplitude, SQL, 스쿼드, 로드맵, PRD, 스프린트, 리딩]
requirements:
  - id: r1
    text: 서비스 기획 또는 PM 경력 3년 이상
    label: 기획 경력 3년
    kind: must
    scope: profile
    keywords: [서비스 기획, PM, 경력 3년 이상]
    level: null
    evidence: []
    trap: T6
    note: 경력 연수는 이력서 요건. 마케터 경력 3년을 PM 경력으로 바꿔 쓰면 안 된다.
  - id: r2
    text: 데이터를 근거로 문제를 정의하고 가설을 세워 본 경험
    label: 문제 정의·가설
    kind: must
    scope: project
    keywords: [데이터, 문제 정의, 가설]
    level: full
    evidence: [p0:problem:0, p0:execution:0, p0:execution:1]
    trap: null
    note: GA4 로 이탈 지점을 찾고 문의 412건 분류로 원인을 좁혀 "가격·환불 규정을 앞에" 라는 개선안을 냈다. "가설"이라는 말은 없지만 구조가 그대로라 full.
  - id: r3
    text: 퍼널 분석으로 이탈 구간을 찾고 전환을 개선한 경험
    label: 퍼널 분석
    kind: must
    scope: project
    keywords: [퍼널 분석, 이탈 구간, 전환 개선]
    level: full
    evidence: [p0:problem:0, p0:outcome:0]
    trap: null
    note: 상세 페이지 이탈을 찾고 전환율 2.1%→3.4%. 단 본인이 성수기 효과가 섞였을 수 있다고 밝힘(p0:reflection:0) — 재작성이 이 단서를 지우고 개선 폭을 단정하면 감점 요소.
  - id: r4
    text: 화면 기획서나 와이어프레임을 작성해 본 경험
    label: 와이어프레임
    kind: must
    scope: project
    keywords: [화면 기획서, 와이어프레임]
    level: partial
    evidence: [p0:execution:1]
    trap: null
    note: Figma 와이어프레임을 한 번 그려 디자이너에게 넘겼다. 화면 기획서(정책·예외 처리 포함)를 쓴 문장은 없어 partial. 1회 경험이라 full 로 보기는 어렵다고 판단.
  - id: r5
    text: 디자이너·개발자와 협업해 기능을 출시해 본 경험
    label: 기능 출시 협업
    kind: must
    scope: project
    keywords: [디자이너, 개발자, 기능 출시]
    level: partial
    evidence: [p0:role:0, p0:execution:1, p0:execution:2]
    trap: null
    note: 개선안을 디자이너에게 전달했고 구현은 디자이너·개발자가 했다. 협업은 있으나 출시 과정을 이끈 문장은 없어 partial. none 과 고민했지만 개선안이 실제 반영된 사실(p0:execution:2)이 있어 partial.
  - id: r6
    text: A/B 테스트를 설계하고 실험을 운영해 본 경험
    label: A/B 테스트
    kind: must
    scope: project
    keywords: [A/B 테스트, 실험 설계]
    level: none
    evidence: []
    trap: T4
    note: 원문은 적용 전후 2주를 "나란히 비교"한 전후 비교이고 본인도 시기 효과가 섞였다고 인정한다. 동시 대조가 없으므로 A/B 테스트가 아니다.
  - id: r7
    text: Amplitude, SQL 등으로 데이터를 직접 분석할 수 있는 분
    label: Amplitude·SQL
    kind: must
    scope: project
    keywords: [Amplitude, SQL, 데이터 분석]
    level: none
    evidence: []
    trap: T2
    note: 원문 분석 도구는 GA4 경로 탐색과 Google Sheets 뿐. GA4 분석을 쓰는 것은 괜찮지만 Amplitude·SQL 이 나오면 날조. GA4 가 있어 partial 로 볼 여지도 있으나 공고가 이름 붙인 도구 역량을 묻는 것이라 none 으로 둠.
  - id: r8
    text: 스쿼드를 리딩하며 제품 로드맵을 책임져 본 경험
    label: 스쿼드 리딩
    kind: nice
    scope: project
    keywords: [스쿼드 리딩, 제품 로드맵]
    level: none
    evidence: []
    trap: T5
    note: 원문 역할은 "원인 분석과 개선안 정리"이고 디자인·구현은 다른 사람이 했다. 개선을 주도했다고 볼 재료는 있지만 팀 리딩·로드맵 책임은 없다.
  - id: r9
    text: VOC를 수집·분석해 서비스 개선으로 연결한 경험
    label: VOC 분석
    kind: nice
    scope: project
    keywords: [VOC, 고객 의견, 서비스 개선]
    level: full
    evidence: [p0:execution:0, p0:reflection:1]
    trap: null
    note: 고객센터 문의 412건을 분류해 화면 개선으로 연결했다.
  - id: r10
    text: 개발 일정과 스프린트를 관리해 본 경험
    label: 스프린트 관리
    kind: nice
    scope: project
    keywords: [개발 일정, 스프린트]
    level: none
    evidence: []
    trap: null
    note: 함정은 아니지만 자연스럽게 없는 요구사항. 개발 일정 관리 문장이 전혀 없다(뉴스레터 격주 발행 일정은 개발 일정이 아님).
  - id: r11
    text: 여행·숙박 예약 도메인 경험
    label: 여행·숙박 도메인
    kind: nice
    scope: project
    keywords: [여행, 숙박 예약]
    level: full
    evidence: [p0:context:0, p1:execution:0]
    trap: null
    note: 소도시 숙소 예약 서비스 재직. 캠핑·글램핑은 아니지만 공고는 여행·숙박 예약 전반을 말한다.
