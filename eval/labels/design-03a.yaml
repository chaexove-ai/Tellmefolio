# 정답 라벨 — 사람이 검수하는 원본입니다. 검수용 표는 npm run eval:review 로 만듭니다.
# level: full(직접 보여줌) / partial(관련 있지만 약함) / none(없음). profile 요건은 null.
# trap: 일부러 넣은 함정. T1 수치 · T2 도구 · T3 도메인 · T4 유사어 · T5 역할 과장 · T6 이력서 요건
case: design-03a
portfolio: pf-design-03
job: jd-design-03a
target_job: 서비스 기획자 (UX 기획)
family: design
job_family: planning
difficulty: cross
reviewed: false
reviewer: null
lead: problem
vocabulary: [서비스 기획, 사용자 흐름, 정보 구조, 화면설계서, 스토리보드, 서비스 정책, 요구사항 정의, 데이터 분석, 유관 부서 조율, 픽업 주문]
must_not_appear: [화면설계서를 작성, 스토리보드, 정책 문서, 요구사항 정의, SQL, Amplitude, 일정 관리, 리딩, PM]
requirements:
  - id: r1
    text: 서비스 기획 또는 UX 기획 실무 경력 2년 이상
    label: 기획 경력 2년
    kind: must
    scope: profile
    keywords: [서비스 기획, 실무 경력, 2년 이상]
    level: null
    evidence: []
    trap: T6
    note: 경력 연수는 이력서 요건. 디자인 5년 차라는 persona 를 기획 경력으로 채우면 안 된다.
  - id: r2
    text: 사용자 흐름과 정보 구조를 설계해 본 경험
    label: 사용자 흐름 설계
    kind: must
    scope: project
    keywords: [사용자 흐름, 정보 구조]
    level: partial
    evidence: [p1:execution:1, p1:problem:1]
    trap: null
    note: 품절 상품을 목록 아래로 내리자는 정보 배치 제안은 했지만, 본인이 회고에서 "화면 흐름은 기획자가 정한 대로만 따랐다"고 쓴다. 흐름 전체 설계는 아니라 partial.
  - id: r3
    text: 화면설계서(스토리보드)를 직접 작성해 본 경험
    label: 화면설계서 작성
    kind: must
    scope: project
    keywords: [화면설계서, 스토리보드, 작성]
    level: none
    evidence: []
    trap: T4
    note: 원문에 "화면설계서"라는 단어가 있지만 기획자가 작성한 것을 받아 UI 를 만든 것이다. 같은 단어를 근거로 삼으면 실패.
  - id: r4
    text: 서비스 정책과 요구사항을 정의하고 문서로 정리해 본 경험
    label: 정책·요구사항 정의
    kind: must
    scope: project
    keywords: [서비스 정책, 요구사항 정의, 문서화]
    level: none
    evidence: []
    trap: null
    note: 서비스 정책·요구사항 문서는 없다. 브랜드 가이드 40쪽(p0:execution:1)은 시각 규칙 문서라 성격이 다르다. 의도한 함정은 아니지만 "가이드 문서"로 잡힐 수 있다.
  - id: r5
    text: SQL 또는 Amplitude 등으로 데이터를 직접 추출해 분석해 본 경험
    label: 데이터 추출·분석
    kind: must
    scope: project
    keywords: [SQL, Amplitude, 데이터 분석]
    level: none
    evidence: []
    trap: T2
    note: 장바구니 담기 비율은 "기획자가 공유한 자료"에서 본 것이고 판매량도 마케팅팀 집계다. 본인이 데이터를 추출·분석한 문장이 없고 도구도 없다.
  - id: r6
    text: 프로젝트 일정을 관리하며 유관 부서를 리딩해 본 경험
    label: 일정 관리·리딩
    kind: must
    scope: project
    keywords: [일정 관리, 리딩, 유관 부서]
    level: none
    evidence: []
    trap: T5
    note: 리뉴얼 방향은 대표·마케팅팀장이, 프로모션 기획과 일정은 마케팅팀이 정했다고 원문이 명시한다. 인쇄소 선정·촬영 대행사 협업은 실무 협업이지 리딩이 아니다.
  - id: r7
    text: 디자이너·개발자와 협업해 기능을 출시해 본 경험
    label: 출시 협업
    kind: nice
    scope: project
    keywords: [디자이너, 개발자, 협업, 출시]
    level: full
    evidence: [p1:execution:1, p1:execution:2, p1:outcome:0]
    trap: null
    note: 기획자에게 제안해 반영됐고 화면을 개발자에게 넘겨 개편이 나갔다.
  - id: r8
    text: 고객 불편을 발견하고 개선안을 제안해 본 경험
    label: 개선안 제안
    kind: nice
    scope: project
    keywords: [고객 불편, 개선안, 제안]
    level: full
    evidence: [p1:problem:1, p1:execution:1]
    trap: null
    note: 품절 상품을 상세 화면에서야 아는 불편을 짚고 회색 처리·하단 정렬을 제안해 반영됐다.
  - id: r9
    text: F&B·모바일 주문 서비스 경험
    label: F&B 주문 도메인
    kind: nice
    scope: project
    keywords: [F&B, 모바일 주문]
    level: full
    evidence: [p1:context:0, p0:context:0]
    trap: null
    note: 베이커리 카페 프랜차이즈의 자체 모바일 주문 앱을 다뤘다. 기획이 아니라 디자인 역할이었지만 도메인 요건으로는 full.
  - id: r10
    text: 개선 결과를 지표로 확인해 본 경험
    label: 지표 확인
    kind: nice
    scope: project
    keywords: [개선 결과, 지표]
    level: partial
    evidence: [p1:outcome:0, p2:outcome:0]
    trap: null
    note: 장바구니 담기 18%→23%, 판매량 1.4배가 있지만 각각 기획자·마케팅팀이 집계했고 디자인 효과만 분리하기 어렵다고 본인이 쓴다. 확인은 했으나 측정 주체가 아니라 partial.
  - id: r11
    text: Figma 등 디자인 도구를 다룰 수 있는 분
    label: 디자인 도구
    kind: nice
    scope: project
    keywords: [Figma, 디자인 도구]
    level: full
    evidence: [p1:execution:2]
    trap: null
    note: Figma 로 화면을 만들어 넘겼다.
