    level: full
    evidence: [p2:execution:0, p2:execution:1, p2:outcome:0]
    trap: null
    note: 문의 분류 체계로 반복 불편이 기획 회의에 1주 안에 올라오게 했다.
  - id: r9
    text: 여러 이해관계자에게 근거를 정리해 공유하고 합의를 이끈 경험
    label: 근거 공유·합의
    kind: nice
